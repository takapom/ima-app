name: config-dry-run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-dry-run:
    name: ${{ matrix.target }} config dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dev
            cf_mode: ''
          - target: staging
            cf_mode: staging
          - target: personal-preview
            cf_mode: personal-preview
          - target: production
            cf_mode: production
    env:
      CI: 'true'
      TARGET: ${{ matrix.target }}
      CF_MODE: ${{ matrix.cf_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: Bundle Worker without deploying
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET:$CF_MODE" in
            dev:)
              cf_args=()
              ;;
            staging:staging|personal-preview:personal-preview|production:production)
              cf_args=(--mode "$CF_MODE")
              ;;
            *)
              echo "unsupported fixed config target: $TARGET:$CF_MODE" >&2
              exit 1
              ;;
          esac
          bunx cf deploy --dry-run "${cf_args[@]}"
