# 本番と同じターンを実モデルと合成店舗で実行する評価（#87・#88）。
# 実行はリポジトリのルートで `bun run eval`。OpenAIの利用料が発生する（モデルとLLM採点）。
# 手順と採否の基準は docs/devlop/development.md の「プロンプトとToolの評価」を参照。
description: ima. AIの振る舞いの評価

# `production`は本番のシステムプロンプトをそのまま使う。案を比べるときは
# `file://prompts/案.txt` のように並べる（ファイルの中の {{ }} はpromptfooのテンプレートとして展開される）。
prompts:
  - production

# Toolのdescriptionの案を比べるときは、同じProviderを`label`と`toolDescriptionsFile`を変えて並べる。
providers:
  - id: file://provider.ts
    label: 現行
    config:
      workerDir: worker
      envFile: .dev.vars.llm
      port: 8791

evaluateOptions:
  # 同時実行を絞り、OpenAIの利用量と待ち時間を抑える。
  maxConcurrency: 2

defaultTest:
  vars:
    shopSet: shibuya-ebisu
    # JSTの土曜20:00。掲載営業時間の読み方を実行ごとに揃える。
    now: '2026-10-10T11:00:00.000Z'
  options:
    # LLM採点に使うモデル。本番と同じく応答をOpenAIに保存させない。
    provider:
      id: openai:responses:gpt-5.6-luna
      config:
        reasoning:
          effort: low
        store: false
  # 全ケースに共通する判定。「ゲート:」は1つでも不合格ならケースを不合格にする必須ゲート、
  # 「スコア:」はweight 0で、指標として記録するが合否には使わない。
  assert:
    - type: javascript
      value: file://assertions.ts:committed
      metric: ゲート:確定
    - type: javascript
      value: file://assertions.ts:noOpenNowClaim
      metric: ゲート:断定しない
    - type: javascript
      value: file://scores.ts:noRepairs
      metric: スコア:修復なし
      weight: 0
    - type: llm-rubric
      metric: スコア:理由の具体性
      weight: 0
      # 採点には、ユーザーに見える発話・メッセージ・カードだけを渡す。
      transform: "output.split('\\n').filter((line) => /^(\\[ターン|メッセージ:|カード\\d)/.test(line)).join('\\n')"
      value: >-
        店舗カードを提案している場合、各カードの理由が、ユーザーの要望のどれに店舗のどの情報
        （ジャンル・掲載文・予算・設備など）が合うのかを具体的に結び付けている。
        カードを提案していない場合は、ユーザーが次に何をすればよいかが分かる説明になっている。
    - type: llm-rubric
      metric: スコア:事実と推測の区別
      weight: 0
      transform: "output.split('\\n').filter((line) => /^(\\[ターン|メッセージ:|カード\\d)/.test(line)).join('\\n')"
      value: >-
        取得した店舗情報で確認できる事実と、推測や確認できない事柄（雰囲気・今営業しているか・
        空席・徒歩時間・終電・滞在できる時間など）を文章の中で区別しており、
        確認できない事柄を断定していない。

tests: file://cases/*.yaml
