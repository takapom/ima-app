# 場所の扱い（ai-behavior.md §2）。
# 現在地があり地名がなければ聞き返さずに現在地周辺を探し、位置情報が使えず地名もなければ地名を尋ねる。
# 全ケースに共通する判定（確定・断定しない・LLM採点など）は promptfooconfig.yaml の defaultTest にある。

- description: 現在地あり・地名なし → 甘いものを現在地周辺で探して提案する
  vars:
    location: available
    turns: 近くで甘いもの食べたい
  assert:
    - type: javascript
      value: file://assertions.ts:kindIs
      config:
        kind: propose
      metric: ゲート:応答の種別
    - type: javascript
      value: file://assertions.ts:firstSearchUsesCurrentLocation
      metric: ゲート:場所の扱い
    - type: javascript
      value: file://scores.ts:firstRadiusIs1000
      metric: スコア:半径1000mから
      weight: 0
    - type: javascript
      value: file://scores.ts:queryAvoidsWords
      config:
        words:
          - 甘いもの
      metric: スコア:検索語
      weight: 0

