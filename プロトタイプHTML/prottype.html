<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>ima map prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f2efe6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.phone{max-width:430px;margin:auto;min-height:100vh;background:#171816}.bar{position:sticky;top:0;z-index:10;background:#171816eF;backdrop-filter:blur(12px);padding:16px 18px 12px;border-bottom:1px solid #2a2c28}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.muted{color:#8f928a;font-size:12px}.prompt{margin:16px 18px 8px;padding:12px 14px;border-radius:18px;background:#20221f;color:#aaa;font-size:13px;line-height:1.55}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c8ff4d;margin-right:8px}.switch{display:flex;margin:12px 18px 8px;background:#22241f;border:1px solid #30332c;border-radius:13px;padding:3px}.switch button{flex:1;border:0;background:transparent;color:#999;padding:9px;border-radius:10px;font-weight:700}.switch button.active{background:#d4ff55;color:#161811}.mapwrap{position:relative;height:360px;margin-top:8px;overflow:hidden;background:#d7d7cf}.map{position:absolute;inset:0;background:linear-gradient(25deg,#d9ddd2,#f0eee3)}.road{position:absolute;background:#fff;border:1px solid #ccc;border-radius:999px;transform-origin:left center}.r1{width:520px;height:16px;left:-60px;top:120px;transform:rotate(17deg)}.r2{width:460px;height:13px;left:15px;top:245px;transform:rotate(-22deg)}.r3{width:420px;height:11px;left:90px;top:15px;transform:rotate(75deg)}.r4{width:300px;height:8px;left:10px;top:60px;transform:rotate(48deg)}.block{position:absolute;background:#c8d1be;border-radius:8px;opacity:.8}.b1{left:20px;top:25px;width:100px;height:60px}.b2{right:20px;top:25px;width:130px;height:80px}.b3{left:30px;bottom:25px;width:125px;height:65px}.b4{right:15px;bottom:30px;width:90px;height:80px}.pin{position:absolute;width:38px;height:38px;border-radius:50% 50% 50% 8px;background:#1e211b;color:#d5ff55;display:grid;place-items:center;font-weight:900;transform:rotate(-45deg);box-shadow:0 4px 12px #0004;cursor:pointer;border:2px solid #d5ff55}.pin span{transform:rotate(45deg)}.pin.active{background:#d5ff55;color:#171816;scale:1.18;z-index:3}.p1{left:65%;top:30%}.p2{left:29%;top:50%}.p3{left:55%;top:67%}.p4{left:18%;top:22%}.me{position:absolute;left:47%;top:43%;width:18px;height:18px;background:#287df1;border:4px solid white;border-radius:50%;box-shadow:0 0 0 6px #287df133}.loc{position:absolute;right:14px;bottom:14px;border:0;width:42px;height:42px;border-radius:50%;background:#fff;color:#222;box-shadow:0 3px 10px #0003;font-size:20px}.sheet{position:relative;margin-top:-22px;background:#171816;border-radius:24px 24px 0 0;padding:8px 0 90px;z-index:5}.handle{width:42px;height:4px;border-radius:99px;background:#555;margin:4px auto 10px}.cards{display:flex;overflow:auto;scroll-snap-type:x mandatory;gap:12px;padding:6px 18px 12px;scrollbar-width:none}.card{min-width:88%;scroll-snap-align:center;background:#20221f;border:1px solid #30332d;border-radius:20px;padding:15px;cursor:pointer}.card.active{border-color:#cfff52}.row{display:flex;gap:12px}.photo{width:74px;height:74px;border-radius:15px;background:linear-gradient(135deg,#c87339,#4d261d);display:grid;place-items:center;font-size:30px}.info{flex:1}.cat{font-size:11px;color:#9b9e94}.name{font-weight:800;font-size:17px;margin:4px 0 7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;background:#2b2e28;border-radius:999px;color:#c7c9c2}.chip.walk{color:#d7ff65}.why{font-size:12px;color:#a6a9a0;line-height:1.5;margin-top:11px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.detail{background:#d5ff55;color:#171816;border:0;border-radius:11px;padding:9px 13px;font-weight:800}.save{background:#2c2e2a;color:#ddd;border:0;border-radius:11px;padding:9px 12px}.list{display:none;padding:4px 18px}.list.show{display:block}.list .card{min-width:100%;margin-bottom:12px}.mapwrap.hide,.sheet.hide{display:none}.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#171816ee;border-top:1px solid #2b2d29;padding:11px 18px calc(11px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:20}.input{flex:1;background:#252723;border-radius:16px;padding:12px;color:#8d9088;font-size:13px}.send{width:42px;border:0;border-radius:14px;background:#d5ff55;font-weight:900}.route{position:absolute;height:4px;background:#6c8fef;border-radius:10px;transform-origin:left center;display:none}.route.show{display:block}.rt1{left:49%;top:45%;width:105px;transform:rotate(-28deg)}.rt2{left:31%;top:54%;width:82px;transform:rotate(-9deg)}.rt3{left:48%;top:47%;width:95px;transform:rotate(63deg)}
</style></head><body><main class='phone'><header class='bar'><div class='top'><div><div class='brand'>ima</div><div class='muted'>いま行ける場所を探す</div></div><div>☰</div></div></header><div class='prompt'><span class='dot'></span>近くで今から入れそうな居酒屋を探しました。距離が近い順に見てみましょう。</div><div class='switch'><button id='mapBtn' class='active'>地図</button><button id='listBtn'>一覧</button></div><section id='mapWrap' class='mapwrap'><div class='map'><div class='block b1'></div><div class='block b2'></div><div class='block b3'></div><div class='block b4'></div><div class='road r1'></div><div class='road r2'></div><div class='road r3'></div><div class='road r4'></div><div class='route rt1'></div><div class='route rt2'></div><div class='route rt3'></div><div class='me' title='現在地'></div><div class='pin p1 active' data-id='0'><span>1</span></div><div class='pin p2' data-id='1'><span>2</span></div><div class='pin p3' data-id='2'><span>3</span></div><div class='pin p4' data-id='3'><span>4</span></div></div><button class='loc' onclick='alert("現在地に戻る（モック）")'>⌖</button></section><section id='sheet' class='sheet'><div class='handle'></div><div id='cards' class='cards'></div></section><section id='list' class='list'></section><footer class='foot'><div class='input'>条件を追加する…</div><button class='send'>↑</button></footer></main><script>
const data=[
{name:'炭火酒場 いまここ',cat:'居酒屋・焼き鳥',walk:'徒歩4分',dist:'280m',price:'¥2,500〜',why:'現在地から最も近く、今から入りやすそうな候補。',emoji:'🍢'},
{name:'炉端と魚 六丁目',cat:'海鮮・炉端',walk:'徒歩7分',dist:'510m',price:'¥3,000〜',why:'少し歩くけど、魚系を食べたいならこの候補。',emoji:'🐟'},
{name:'餃子とレモンサワー',cat:'餃子・中華',walk:'徒歩9分',dist:'690m',price:'¥2,000〜',why:'価格を抑えつつサクッと飲みたい時に。',emoji:'🥟'},
{name:'夜カフェ 余白',cat:'カフェ・ダイニング',walk:'徒歩12分',dist:'920m',price:'¥1,500〜',why:'飲みより落ち着いて話したい時向け。',emoji:'☕'}];
const cards=document.querySelector('#cards'),list=document.querySelector('#list');
function markup(x,i){return `<article class="card ${i===0?'active':''}" data-id="${i}"><div class="row"><div class="photo">${x.emoji}</div><div class="info"><div class="cat">${x.cat}</div><div class="name">${x.name}</div><div class="chips"><span class="chip walk">🚶 ${x.walk}</span><span class="chip">${x.dist}</span><span class="chip">${x.price}</span></div></div></div><div class="why">${x.why}</div><div class="actions"><button class="detail" onclick="event.stopPropagation();alert('${x.name} の詳細（モック）')">詳しく見る</button><button class="save" onclick="event.stopPropagation();this.textContent=this.textContent==='♡ 保存'?'♥ 保存済み':'♡ 保存'">♡ 保存</button></div></article>`}
cards.innerHTML=data.map(markup).join(''); list.innerHTML=data.map(markup).join('');
function select(id){document.querySelectorAll('.pin').forEach((p,i)=>p.classList.toggle('active',i==id));document.querySelectorAll('#cards .card').forEach((c,i)=>c.classList.toggle('active',i==id));document.querySelectorAll('.route').forEach((r,i)=>r.classList.toggle('show',i==id));const c=document.querySelector(`#cards .card[data-id="${id}"]`);c?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>select(+p.dataset.id));document.querySelectorAll('#cards .card').forEach(c=>c.onclick=()=>select(+c.dataset.id));
mapBtn.onclick=()=>{mapBtn.classList.add('active');listBtn.classList.remove('active');mapWrap.classList.remove('hide');sheet.classList.remove('hide');list.classList.remove('show')};
listBtn.onclick=()=>{listBtn.classList.add('active');mapBtn.classList.remove('active');mapWrap.classList.add('hide');sheet.classList.add('hide');list.classList.add('show')};
</script></body></html>
