<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>ima map prototype</title>
    <link rel="stylesheet" href="./prototype.css" />
  </head>
  <body>
    <main class="phone">
      <header class="bar">
        <div class="top">
          <div>
            <div class="brand">ima</div>
            <div class="muted">いま行ける場所を探す</div>
          </div>
          <div>☰</div>
        </div>
      </header>
      <div class="prompt">
        <span class="dot"></span
        >近くで今から入れそうな居酒屋を探しました。距離が近い順に見てみましょう。
      </div>
      <div class="switch">
        <button id="mapBtn" class="active">地図</button><button id="listBtn">一覧</button>
      </div>
      <section id="mapWrap" class="mapwrap">
        <div class="map">
          <div class="block b1"></div>
          <div class="block b2"></div>
          <div class="block b3"></div>
          <div class="block b4"></div>
          <div class="road r1"></div>
          <div class="road r2"></div>
          <div class="road r3"></div>
          <div class="road r4"></div>
          <div class="route rt1"></div>
          <div class="route rt2"></div>
          <div class="route rt3"></div>
          <div class="me" title="現在地"></div>
          <div class="pin p1 active" data-id="0"><span>1</span></div>
          <div class="pin p2" data-id="1"><span>2</span></div>
          <div class="pin p3" data-id="2"><span>3</span></div>
          <div class="pin p4" data-id="3"><span>4</span></div>
        </div>
        <button class="loc" onclick="alert('現在地に戻る（モック）')">⌖</button>
      </section>
      <section id="sheet" class="sheet">
        <div class="handle"></div>
        <div id="cards" class="cards"></div>
      </section>
      <section id="list" class="list"></section>
      <footer class="foot">
        <div class="input">条件を追加する…</div>
        <button class="send">↑</button>
      </footer>
    </main>
    <script>
      const data = [
        {
          name: '炭火酒場 いまここ',
          cat: '居酒屋・焼き鳥',
          walk: '徒歩4分',
          dist: '280m',
          price: '¥2,500〜',
          why: '現在地から最も近く、今から入りやすそうな候補。',
          emoji: '🍢',
        },
        {
          name: '炉端と魚 六丁目',
          cat: '海鮮・炉端',
          walk: '徒歩7分',
          dist: '510m',
          price: '¥3,000〜',
          why: '少し歩くけど、魚系を食べたいならこの候補。',
          emoji: '🐟',
        },
        {
          name: '餃子とレモンサワー',
          cat: '餃子・中華',
          walk: '徒歩9分',
          dist: '690m',
          price: '¥2,000〜',
          why: '価格を抑えつつサクッと飲みたい時に。',
          emoji: '🥟',
        },
        {
          name: '夜カフェ 余白',
          cat: 'カフェ・ダイニング',
          walk: '徒歩12分',
          dist: '920m',
          price: '¥1,500〜',
          why: '飲みより落ち着いて話したい時向け。',
          emoji: '☕',
        },
      ];
      const cards = document.querySelector('#cards'),
        list = document.querySelector('#list');
      function markup(x, i) {
        return `<article class="card ${i === 0 ? 'active' : ''}" data-id="${i}"><div class="row"><div class="photo">${x.emoji}</div><div class="info"><div class="cat">${x.cat}</div><div class="name">${x.name}</div><div class="chips"><span class="chip walk">🚶 ${x.walk}</span><span class="chip">${x.dist}</span><span class="chip">${x.price}</span></div></div></div><div class="why">${x.why}</div><div class="actions"><button class="detail" onclick="event.stopPropagation();alert('${x.name} の詳細（モック）')">詳しく見る</button><button class="save" onclick="event.stopPropagation();this.textContent=this.textContent==='♡ 保存'?'♥ 保存済み':'♡ 保存'">♡ 保存</button></div></article>`;
      }
      cards.innerHTML = data.map(markup).join('');
      list.innerHTML = data.map(markup).join('');
      function select(id) {
        document.querySelectorAll('.pin').forEach((p, i) => p.classList.toggle('active', i == id));
        document
          .querySelectorAll('#cards .card')
          .forEach((c, i) => c.classList.toggle('active', i == id));
        document.querySelectorAll('.route').forEach((r, i) => r.classList.toggle('show', i == id));
        const c = document.querySelector(`#cards .card[data-id="${id}"]`);
        c?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
      document.querySelectorAll('.pin').forEach((p) => (p.onclick = () => select(+p.dataset.id)));
      document
        .querySelectorAll('#cards .card')
        .forEach((c) => (c.onclick = () => select(+c.dataset.id)));
      mapBtn.onclick = () => {
        mapBtn.classList.add('active');
        listBtn.classList.remove('active');
        mapWrap.classList.remove('hide');
        sheet.classList.remove('hide');
        list.classList.remove('show');
      };
      listBtn.onclick = () => {
        listBtn.classList.add('active');
        mapBtn.classList.remove('active');
        mapWrap.classList.add('hide');
        sheet.classList.add('hide');
        list.classList.add('show');
      };
    </script>
  </body>
</html>
